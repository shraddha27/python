<div class="login-container">
  <div class="login-box">
    <h1>Task Manager</h1>
    <p>Sign in with your Google account</p>

    <div class="google-button" #googleButtonContainer></div>

    <div *ngIf="error()" class="error-message">
      {{ error() }}
    </div>

    <div *ngIf="loading()" class="loading-message">Signing in...</div>
  </div>
</div>
